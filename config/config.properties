# Distributed Query Executor 설정 (Java 스타일 key=value)
# 운영 배포 시 /data1/distributed-query-executor/config/config.properties 로 복사해 사용한다.

app.name=distributed-query-executor
# true 로 두면 로그 레벨이 DEBUG 로 내려가, 처리 흐름(단계 전이·진행률·실행 SQL)이 로그 파일에
# 상세히 남는다(log.level=DEBUG 와 동일 효과). 평상시(false/INFO)에는 상세 로그가 찍히지 않아
# 추가 IO 가 없다. 문제 추적이 필요할 때만 켠다.
app.debug=false

# 쿼리 파싱 기본 방언(dialect). 요청에서 sql_dialect 로 재정의한다. 예: hive, impala, trino, postgres
query.sql_dialect=hive

# ───────── 쿼리 템플릿 엔진 ─────────
# SELECT/STAGING DDL/INSERT 를 서버 템플릿 파일로 런타임 생성한다(요청은 파라미터만 전달).
# template.dir 아래 <template_id>/manifest.yml + *.sql.j2 조각으로 시나리오를 정의한다.
template.enabled=true
# 개발 시 저장소 루트의 templates/ 사용(config 와 같은 레벨, 실행 CWD 기준 상대). 운영은 config.yml 기본값.
template.dir=templates
template.auto_reload=false
# 커스텀 함수 모듈(쉼표 구분 import 경로). 예: mypkg.query_funcs
template.func_modules=
# 렌더된 DDL/INSERT 를 단일 SQL 문으로 강제(다중 문 인젝션 방지)
template.validate_ddl_single_stmt=true

# 로깅 (개발용 — 상대 경로 logs. 패키징 배포는 config.yml 기본값 /data1/distributed-query-executor/logs 사용)
# level=DEBUG(또는 app.debug=true)면 처리 흐름을 상세히 남긴다: 단계(phase) 전이, 진행률
# (10만행 간격), HTTP 요청/응답. INFO 에서는 이 상세 로그가 없어 IO 부담이 없다.
# (실행 SQL 은 log.sql.* 로 레벨과 무관하게 INFO 로 항상 남는다 — 아래 참고)
log.level=DEBUG
log.dir=logs
log.backup_count=30
log.filename.coordinator=query-coordinator-server.log
log.filename.executor=query-executor-server.log
# HTTP 요청/응답 로깅(core.http). log.level=DEBUG(또는 app.debug=true)일 때만 자동 기록.
# 본문·헤더는 마스킹·절단, 잡음 경로는 제외. enabled=false 로 DEBUG 여도 끌 수 있다.
log.http.enabled=true
log.http.bodies=true
log.http.max_body=2048
log.http.headers=false
log.http.exclude_paths=/health,/metrics,/assets,/favicon.ico,/docs,/redoc,/openapi.json
# 실행 SQL 로깅(core.sql). log.level 과 무관하게 INFO 로 항상 남는다 — 어떤 데이터소스
# (impala/trino/greenplum/history)에 어떤 쿼리를 던졌는지는 감사·사고추적의 1차 근거다.
# 로그 줄에는 [job_id][task_id] 가 자동으로 붙는다. 끄려면 enabled=false.
log.sql.enabled=true
log.sql.max_length=4000
log.sql.params=true

# ───────── Coordinator ─────────
coordinator.host=0.0.0.0
coordinator.port=8088
# executor 실행 방식: remote(HTTP 디스패치) | local(in-process 직접 실행, 로컬 검증용)
# 환경변수 COORDINATOR_EXECUTOR_MODE=local 로도 즉시 토글 가능
coordinator.executor_mode=remote
# 멀티 coordinator 식별자(미지정 시 coordinator-<랜덤숫자>). 환경변수 COORDINATOR_ID 로도 지정 가능
coordinator.id=

# 메타 저장소 스키마(모든 메타 테이블 공통 한정, 기본 public). 앱 SQL·DDL 공통 적용.
db.schema=public

# Job 저장소: memory(휘발) | file(단일 노드 파일 영속/크래시 복구) | postgres(멀티 coordinator 공유, DSN 은 history.db_dsn 재사용)
store.backend=postgres
store.table=jobs
# backend=file 일 때 스냅샷 파일 경로(비우면 로그 디렉터리 옆 jobs-state.json)
store.path=

# / 모니터링 대시보드(읽기 전용, 비밀값 마스킹). 노출 우려 시 false
dashboard.enabled=true
# executor 서비스 URL 목록(쉼표 구분). systemd 인스턴스 포트와 일치시킬 것.
coordinator.executors=http://127.0.0.1:8087,http://127.0.0.1:8086
coordinator.max_concurrent_jobs=16
coordinator.max_dispatch_concurrency=32
# stage_insert: staging 테이블명에 task_id 접미사(task별 고유) + task 종료 시 DROP. 풀 재사용 시 TEMP "already exists" 충돌 방지
coordinator.stage_unique_staging=true
coordinator.poll_interval_s=1.0
coordinator.task_timeout_s=3600
# executor 장애 대응: 연결 실패 시 재시도 후 다른 executor 로 failover
coordinator.task_connect_timeout_s=5.0
coordinator.task_max_retries=2
coordinator.task_retry_backoff_s=0.5
coordinator.task_failover=true
# executor 선택 정책(failover 순서): round_robin(기본) | least_loaded | p2c(HA 권장).
# least_loaded/p2c 는 헬스 스냅샷(헬스+부하)을 보고 살아있는·한가한 노드 먼저 시도.
coordinator.executor_select=round_robin
# Phase 3(HA) — 부하 뷰 소스/공유 예약/coordinator 정합
coordinator.executor_health_source=auto
coordinator.executor_reservation=false
coordinator.reservation_ttl_s=60
coordinator.heartbeat_interval_s=10
coordinator.coordinator_stale_s=30
coordinator.orphan_reconcile_interval_s=30

# Coordinator - executor 헬스 모니터링 & 메트릭 기록
monitor.enabled=true
monitor.health_interval_s=10
monitor.record_interval_s=60
# 기록 대상 PostgreSQL DSN. 비어 있으면 폴링만 하고 DB 기록은 하지 않는다.
monitor.db_dsn=
monitor.table=executor_health_metrics
monitor.disk_path=/

# 실행 이력(PostgreSQL). 비우면 monitor.db_dsn 재사용, 둘 다 없으면 비활성.
#  - history.table      : coordinator 가 기록하는 job 단위 이력
#  - history.task_table : executor 가 기록하는 task(=executor job) 단위 이력
# executor 도 이 DSN 으로 task_history 에 기록하므로 executor 호스트에 PG 자격증명 필요.
history.db_dsn=postgresql://coordinator:coordinator@localhost:5432/qq
history.table=job_history
history.task_table=task_history

# ───────── Executor ─────────
executor.host=0.0.0.0

# Executor - 멀티 coordinator: 자기 상태를 공유 DB에 self-report(coordinator는 읽기만)
executor.self_report=false
executor.status_table=executor_status
# self-report 에 기록할 자기 base URL(HA URL 키 부하 뷰). coordinator.executors 의 URL 과 일치시킬 것.
# 비우면 EXECUTOR_ADVERTISE_URL 환경변수(런처가 http://host:port 로 설정)를 쓴다.
executor.advertise_url=
executor.status_interval_s=10
# executor 자체 동시 task 상한(admission control). 0=무제한
executor.max_concurrent_tasks=8
# 종료(SIGTERM) 시 진행 중 task 완료를 기다리는 최대 시간(초) — graceful drain
executor.shutdown_drain_timeout_s=25

# Executor - 소스 엔진: impala 전용(하위 호환용 키). executor 가 SELECT 를 읽는 소스는 Impala 다.
source.type=impala

# Executor - Impala (source). impala.host 가 비어 있으면 MockBackend 사용.
impala.host=
impala.port=21050
impala.database=default
# 인증: LDAP(사용자/비밀번호) 기본. 비밀번호 보호를 위해 TLS(use_ssl) 사용을 권장한다.
#   다른 방식: PLAIN | NOSASL
impala.auth_mechanism=LDAP
# TLS (Impala 에만 적용)
impala.use_ssl=true
impala.ca_cert=/data1/distributed-query-executor/config/impala-ca.pem
# LDAP/PLAIN 인증 시 필수. LDAP 바인드 사용자/비밀번호.
impala.user=
impala.password=
# Impala 쿼리 옵션 전역 기본값(SET). 예: MEM_LIMIT=2g,REQUEST_POOL=etl
# 비우면 configuration 없이 그대로 실행. 요청별 impala_query_options 가 덮어쓴다.
impala.query_options=

# Executor - query-execute 커스텀 실행 함수(POST /query-execute 의 소스 실행 = /query-run 위임).
# query-execute 의 소스 실행은 executor 가 직접 접속하지 않고 여기
# 지정한 외부 함수에 위임한다(greenplum/history 는 coordinator 직접, 이 설정과 무관).
#   query.func.module   : dotted path (module:func 또는 module.func). 비우면 /query-run 은 400.
#   query.func.config.* : 함수에 넘길 설정 dict. 접두어를 뗀 키로 통째 전달(값은 문자열).
#                         새 파라미터는 아래에 한 줄 추가만 하면 된다(YAML/코드 수정 불필요).
# 예제 참조 구현: customs/query_funcs/trino_runner.py (docs/QUERY.md 참고)
query.func.module=
#query.func.module=customs.query_funcs.trino_runner:run
#query.func.config.host=trino.example.com
#query.func.config.port=8080
#query.func.config.user=query-executor
#query.func.config.catalog=hive
#query.func.config.schema=default
#query.func.config.http_scheme=http
# 사내 표준이 trino 드라이버가 아니라 "SQL → pandas DataFrame" 커스텀 API 라면 이 한 줄로
# 그 경로를 쓴다(trino_runner 가 드라이버 대신 이 함수를 호출한다).
#   계약: query(sql, *, config, limit) -> pandas.DataFrame
# 받은 DataFrame 은 _shape 가 그대로 정형한다(컬럼명·잘림 판정 + numpy/NaN 정규화).
#query.func.config.dataframe_module=mycorp.trino_api:query
#
# ── 이관(/jobs)의 소스 읽기: 커서 없는 커스텀 API ──
# template manifest 에 datasource: trino 를 적으면, 그 job 의 SELECT 를 아래 함수로 읽는다
# (datasource: impala 또는 미지정이면 기존 impyla 커서 경로 그대로 — 이 설정과 무관).
#   계약: fetch(sql, *, config) -> DataFrame | [{컬럼:값},...] | {"columns":[...],"rows":[...]}
#         | (columns, rows) | 그 형태의 청크를 yield 하는 이터러블
#   ※ limit 없이 **전량**을 돌려줘야 한다. run() 처럼 자르면 잘린 결과가 조용히 적재된다.
#   ※ 접속 설정은 위 query.func.config.* 를 그대로 공유한다.
#   ※ 대용량이면 청크를 yield 하는 형태를 쓴다(전량 메모리 적재 방지).
#query.func.fetch_module=customs.query_funcs.trino_runner:fetch_all

# Executor - Greenplum (target). greenplum.dsn 이 비어 있으면 MockBackend 사용.
# Greenplum 은 TLS 미적용 — 일반 postgresql DSN.
#   예: postgresql://gpuser:gppassword@greenplum.example.local:5432/warehouse
greenplum.dsn=
# Greenplum 커넥션 풀 최대 크기(executor 1대가 동시에 여는 GP 연결 상한).
# 0이면 executor.max_concurrent_tasks 와 동일하게 둔다(동시 task 당 1 연결). 다운스트림
# Greenplum max_connections 보호의 직접 손잡이 — 동시 task 보다 작게 두면 추가 throttle.
greenplum.pool_max=0
copy.batch_size=10000
# copy 모드 COPY 전 컬럼 사전검증(SELECT 컬럼이 대상 테이블에 있는지). 불일치 시 조기 실패.
copy.preflight=true
# Impala 읽기(fetch)와 Greenplum 쓰기(COPY)를 별도 스레드로 겹쳐 실행해 벽시계를 줄인다.
# 문제 격리(직렬 계측)나 스레드 회피가 필요하면 false 로 끈다.
copy.pipeline=true
# 파이프라인 큐 크기(배치 개수). 리더가 앞서 채워 둘 수 있는 배치 수 상한(메모리 = 이 값 × batch_size 행).
copy.queue_size=8
# COPY 포맷: text(기본) | binary. binary 는 값을 문자열로 인코딩하지 않아 클라이언트 CPU(write_wait)를
# 줄인다. 컬럼 타입을 대상 테이블에서 해석하며, 실패하면 자동으로 text 로 폴백한다(write_wait 병목 시 실험).
copy.format=text

# ───────── s3_stage (S3 경유 스테이징, 2-phase) ─────────
# local_stage 의 형제(같은 2-phase). Phase 1: executor 가 Impala 결과를 로컬 CSV → S3 업로드
# (로컬 삭제). 배리어. Phase 2: coordinator 가 GP master 에 job 프리픽스로 PXF 외부테이블 하나를
# 만들어 target INSERT. Phase 3: S3 정리. 세그먼트 co-locate 불필요. s3.bucket 이 비면 미구성이라
# s3_stage 를 요청할 때만 오류(다른 모드엔 무영향). 업로드는 boto3(requirements-executor.txt),
# GP 읽기는 PXF SERVER 설정의 자격증명을 쓴다. coordinator·executor 가 같은 s3.* 를 공유한다.
#s3.bucket=
#s3.prefix=dqe-stage
# 온프렘 S3 호환(MinIO/Ceph)이면 endpoint_url 지정. AWS 면 비운다.
#s3.endpoint_url=
#s3.region=
#s3.access_key=
#s3.secret_key=
#s3.use_ssl=true
# GP 읽기(PXF): 자격증명은 세그먼트의 PXF SERVER 설정($PXF_BASE/servers/<server>/s3-site.xml)에서
# 읽으므로 여기엔 서버 이름만 준다. 프로파일 기본은 s3:csv.
#s3.pxf_server=
#s3.pxf_profile=s3:csv
# Phase 2 에 만드는 외부테이블의 스키마. 지정하면 <schema>.s3ext_<job_id>(예: dwtemp.s3ext_j1)로
# 생성/DROP 하고 insert_sql 의 staging 참조도 같은 한정 이름으로 치환된다. 비우면 예전처럼
# 비한정 이름이라 GP 세션 search_path 를 따른다. 스키마는 운영자가 미리 만들어 둬야 한다.
#s3.external_schema=dwtemp
# 고급: LOCATION 문자열 raw override({bucket}/{key}/{profile}/{server} 치환).
#s3.gp_location_template=
#s3.delete_on_cleanup=true
