# 분산 쿼리 실행기 메인 설정.
# 값은 Spring Boot 스타일 자리표시자 ${변수:기본값} 을 사용하며,
# config.properties 의 같은 이름 변수로 덮어쓸 수 있다(없으면 콜론 뒤 기본값 사용).

app:
  name: ${app.name:distributed-query-executor}   # 애플리케이션 이름
  debug: ${app.debug:false}                       # 디버그 모드(상세 로깅/검증)

query:
  sql_dialect: ${query.sql_dialect:hive}          # 쿼리 파싱 기본 방언(요청에서 재정의 가능)

# ───────── 쿼리 템플릿 엔진 ─────────
# SELECT/STAGING DDL/INSERT 를 서버 템플릿 파일로 런타임 생성한다(요청은 파라미터만 전달).
# 템플릿 루트 아래 <template_id>/manifest.yml + *.sql.j2 조각으로 하나의 이관 시나리오를 이룬다.
template:
  enabled: ${template.enabled:true}                       # 템플릿 기능 사용 여부
  dir: ${template.dir:/data1/distributed-query-executor/templates}  # 템플릿 루트 디렉터리(config 와 같은 레벨, 개발: templates)
  auto_reload: ${template.auto_reload:false}              # 파일 변경 자동 리로드(개발 편의, 운영 off)
  func_modules: ${template.func_modules:}                 # 커스텀 함수 모듈(쉼표 구분 import 경로). 기동 시 import 되어 필터/글로벌 등록
  validate_ddl_single_stmt: ${template.validate_ddl_single_stmt:true}  # 렌더된 DDL/INSERT 를 단일 문으로 강제(다중 문 인젝션 방지)

# ───────── 로깅 ─────────
# 일 단위 롤링(파일명_YYYYMMDD.log). INFO 메인 로그와 WARNING 전용 로그를 분리한다.
logging:
  level: ${log.level:INFO}                        # 메인 로그 레벨(이 레벨 이상을 메인 파일에 기록)
  dir: ${log.dir:/data1/distributed-query-executor/logs}    # 로그 디렉터리
  rolling:
    type: daily                                   # 롤링 방식(일 단위)
    backup_count: ${log.backup_count:30}          # 보관 일수(초과분 자동 삭제)
  filename:
    coordinator: ${log.filename.coordinator:query-coordinator-server.log}   # coordinator 메인 로그 파일
    executor: ${log.filename.executor:query-executor-server.log}            # executor 메인 로그 파일
  # WARNING 이상만 별도 파일로 모아 운영 중 문제만 빠르게 추적한다.
  # 파일명은 메인 로그 stem 뒤에 suffix 를 붙인 형태(예: query-coordinator-server-warn.log).
  # 메인 레벨(level)을 WARNING 보다 높게 잡아도 이 로그는 비지 않으며, 로거 이름까지 함께 남긴다.
  warn:
    enabled: ${log.warn.enabled:true}             # WARNING 전용 로그 사용 여부
    level: ${log.warn.level:WARNING}              # 전용 로그에 모을 최소 레벨(WARNING/ERROR)
    suffix: ${log.warn.suffix:-warn}              # 메인 파일명 stem 뒤에 붙는 접미사
  # HTTP 요청/응답 로깅(core.http 로거). 메인 로그 레벨이 DEBUG 일 때만 자동으로 기록된다
  # (app.debug=true 또는 log.level=DEBUG). enabled=false 면 DEBUG 여도 끈다. 본문·헤더는
  # 마스킹·절단하며, 잡음 경로(health/metrics/정적/docs)는 exclude_paths 로 제외한다.
  http:
    enabled: ${log.http.enabled:true}             # DEBUG 여도 끌 수 있는 스위치
    bodies: ${log.http.bodies:true}               # 요청/응답 본문 포함(마스킹·max_body 절단)
    max_body: ${log.http.max_body:2048}           # 본문 로그 최대 바이트(초과분 절단)
    headers: ${log.http.headers:false}            # 요청/응답 헤더 포함(민감 헤더 값 마스킹)
    # 로깅 제외 경로(쉼표 구분, 정확 일치 또는 prefix/ 하위)
    exclude_paths: ${log.http.exclude_paths:/health,/metrics,/assets,/favicon.ico,/docs,/redoc,/openapi.json}

# ───────── Coordinator ─────────
coordinator:
  host: ${coordinator.host:0.0.0.0}                       # 바인드 주소
  port: ${coordinator.port:8088}                          # 수신 포트
  executor_mode: ${coordinator.executor_mode:remote}      # remote(HTTP 디스패치) | local(in-process 직접 실행)
  id: ${coordinator.id:}                                  # 멀티 coordinator 식별자(미지정 시 coordinator-<랜덤숫자>)
  executors: ${coordinator.executors:}                    # executor 베이스 URL 목록(쉼표 구분)
  # 동시 실행 슬롯 + 대기 큐(admission control)
  max_concurrent_jobs: ${coordinator.max_concurrent_jobs:16}   # 동시에 RUNNING 가능한 job 수(실행 슬롯)
  max_pending_jobs: ${coordinator.max_pending_jobs:100}        # 슬롯이 다 찼을 때 PENDING 으로 대기 가능한 job 수.
                                                               # 실행+대기 합을 넘는 요청은 429 로 거부. 0 이하면 무제한.
  max_dispatch_concurrency: ${coordinator.max_dispatch_concurrency:32}   # 동시 task 디스패치 상한(코루틴 동시성)
  stage_unique_staging: ${coordinator.stage_unique_staging:true}   # stage_insert: staging 테이블명에 task_id 접미사(task별 고유) + task 종료 시 DROP. 풀 재사용 시 TEMP "already exists" 충돌 방지
  poll_interval_s: ${coordinator.poll_interval_s:1.0}     # task 상태 폴링 간격(초)
  task_timeout_s: ${coordinator.task_timeout_s:3600}      # task HTTP 전체(read) 타임아웃(초)
  # executor 장애 대응(연결 실패 시 재시도 → 다른 executor 로 failover)
  task_connect_timeout_s: ${coordinator.task_connect_timeout_s:5.0}  # 접속 전용 타임아웃(초). 죽은 executor 빠르게 실패
  task_max_retries: ${coordinator.task_max_retries:2}     # 연결 실패 시 같은 executor 재시도 횟수(지수 백오프)
  task_retry_backoff_s: ${coordinator.task_retry_backoff_s:0.5}      # 재시도 백오프 기준(초): backoff*2**시도
  task_failover: ${coordinator.task_failover:true}        # 재시도 소진 시 다른 executor 로 재배정

  executor_select: ${coordinator.executor_select:round_robin}  # executor 선택: round_robin(기본) | least_loaded | p2c(HA 권장)
  # Phase 3(HA): 부하 뷰 소스 auto(멀티=self_report, 단일=monitor) | monitor | self_report
  executor_health_source: ${coordinator.executor_health_source:auto}
  executor_reservation: ${coordinator.executor_reservation:false}   # 공유 예약(엄격 균형). true 면 dispatch 중 task 를 예약
  reservation_ttl_s: ${coordinator.reservation_ttl_s:60}            # 예약 만료(죽은 coordinator 누수 방지)
  heartbeat_interval_s: ${coordinator.heartbeat_interval_s:10}      # coordinator 자기 생존 heartbeat 주기
  coordinator_stale_s: ${coordinator.coordinator_stale_s:30}        # coordinator 생존 판정 임계(초)
  orphan_reconcile_interval_s: ${coordinator.orphan_reconcile_interval_s:30}  # 죽은 coordinator 소유 job 정합 주기(0=비활성)

db:
  # 메타 저장소 스키마. jobs/job_history/task_history/executor_status/executor_health_metrics/
  # coordinator_status/executor_reservation 등 모든 메타 테이블을 이 스키마로 한정한다(기본 public).
  # 앱 런타임 SQL 과 DDL(postgresql.sql/warehousepg.sql)이 같은 스키마를 가리키게 한다.
  # 개별 테이블명을 'myschema.t' 처럼 이미 한정하면 그 값은 그대로 둔다(중복 한정 안 함).
  schema: ${db.schema:public}

store:
  backend: ${store.backend:memory}                # 작업 저장소: memory(휘발) | file(단일 노드 파일 영속/크래시 복구) | postgres(멀티 coordinator 공유)
  table: ${store.table:jobs}                      # 공유 store 테이블명(postgres)
  path: ${store.path:}                            # backend=file 일 때 스냅샷 경로(비우면 로그 디렉터리 옆 jobs-state.json)

dashboard:
  enabled: ${dashboard.enabled:true}              # / 모니터링 대시보드 사용 여부(읽기 전용)

monitor:
  enabled: ${monitor.enabled:true}               # executor 헬스/메트릭 모니터링 사용 여부
  health_interval_s: ${monitor.health_interval_s:10}    # 헬스 체크 주기(초)
  record_interval_s: ${monitor.record_interval_s:60}    # 메트릭 기록 주기(초)
  db_dsn: ${monitor.db_dsn:}                      # 메트릭 기록 DB DSN(미설정 시 기록 생략)
  table: ${monitor.table:executor_health_metrics}       # 메트릭 테이블명
  disk_path: ${monitor.disk_path:/}              # 디스크 사용량 측정 경로

history:
  db_dsn: ${history.db_dsn:}                      # 실행 이력/상태 공유 DB DSN(미설정 시 이력 비활성)
  table: ${history.table:job_history}             # job 실행 이력 테이블
  task_table: ${history.task_table:task_history}  # task 실행 이력 테이블

# ───────── Executor ─────────
executor:
  host: ${executor.host:0.0.0.0}                          # 바인드 주소(포트는 EXECUTOR_PORT 환경변수)
  self_report: ${executor.self_report:false}             # 상태를 공유 DB에 self-report 할지(멀티 coordinator)
  advertise_url: ${executor.advertise_url:}              # self-report 에 기록할 자기 base URL(HA URL 키 부하 뷰). coordinator.executors 의 URL 과 일치
  gp_hostname: ${executor.gp_hostname:}                  # local_stage: 이 executor 의 GP 세그먼트 호스트명(gp_segment_configuration.hostname 과 일치, file:// URI 조립용)

  status_table: ${executor.status_table:executor_status} # self-report 상태 테이블
  status_interval_s: ${executor.status_interval_s:10}    # self-report 주기(초)
  max_concurrent_tasks: ${executor.max_concurrent_tasks:8}   # executor 1대가 동시에 실행하는 task 수(0=무제한)
  shutdown_drain_timeout_s: ${executor.shutdown_drain_timeout_s:25}  # 종료(SIGTERM) 시 진행 중 task 완료를 기다리는 최대 시간(초)
  source:
    type: ${source.type:impala}                   # 소스 엔진: impala 전용(하위 호환용 키)
  impala:
    host: ${impala.host:}                         # Impala 호스트(미설정 시 Mock 백엔드)
    port: ${impala.port:21050}
    database: ${impala.database:default}
    auth_mechanism: ${impala.auth_mechanism:LDAP}   # LDAP(기본) | PLAIN | NOSASL
    use_ssl: ${impala.use_ssl:true}
    ca_cert: ${impala.ca_cert:}
    user: ${impala.user:}
    password: ${impala.password:}
    # Impala 쿼리 옵션 전역 기본값(SET). "MEM_LIMIT=2g,REQUEST_POOL=etl" 형태.
    # 비우면 configuration 없이 그대로 실행. 요청별 impala_query_options 가 덮어쓴다.
    query_options: ${impala.query_options:}
  greenplum:
    dsn: ${greenplum.dsn:}                        # Greenplum 적재 대상 DSN(미설정 시 Mock 백엔드)
    pool_max: ${greenplum.pool_max:0}             # GP 커넥션 풀 최대 크기(0=executor.max_concurrent_tasks 와 동일)
  copy:
    batch_size: ${copy.batch_size:10000}          # COPY 배치 크기(행)
    preflight: ${copy.preflight:true}             # COPY 전 SELECT 컬럼이 대상 테이블에 있는지 사전검증(불일치 조기 실패)
    pipeline: ${copy.pipeline:true}               # Impala 읽기와 GP COPY 를 별도 스레드로 겹쳐 실행(벽시계 단축)
    queue_size: ${copy.queue_size:8}              # 파이프라인 큐 크기(배치 개수). 메모리 ≈ queue_size × batch_size 행
    format: ${copy.format:text}                   # COPY 포맷 text|binary. binary 는 인코딩 CPU 절감(타입 해석 실패 시 text 폴백)
  stage:                                          # local_stage(file:// 세그먼트 로컬 스테이징, DESIGN §17)
    local_dir: ${stage.local_dir:/data1/distributed-query-executor/stage}  # 로컬 CSV 저장 루트(모든 세그먼트 호스트 동일 경로, job_id 하위로 격리)
    csv_delimiter: ${stage.csv_delimiter:`}       # CSV 컬럼 구분자(기본 backtick `). executor write 와 외부테이블 FORMAT 이 공유
    csv_null: ${stage.csv_null:}                  # CSV NULL 표현(기본 빈 문자열)
    csv_quote: ${stage.csv_quote:"}               # CSV 인용문자(기본 ")
    cleanup: ${stage.cleanup:true}                # 적재 성공 후 로컬 CSV 디렉터리/외부테이블 정리 여부
    validate_hosts: ${stage.validate_hosts:true}  # Phase 2 전 file:// 호스트를 gp_segment_configuration 과 대조 검증(불일치 조기 실패)
    max_files_per_host: ${stage.max_files_per_host:0}  # 호스트당 최대 파일 수(0=gp_segment_configuration 의 호스트별 primary 세그먼트 수 S_h)
    impala_convert_types: ${stage.impala_convert_types:false}  # export fetch 형변환(false=끔: timestamp/date/decimal 을 wire 문자열 그대로 받아 CSV write, 재파싱 비용 제거)
  s3:                                             # s3_stage(S3 경유 스테이징) — local_stage 형제, 세그먼트 co-locate 불필요
    bucket: ${s3.bucket:}                         # S3 버킷(비우면 s3_stage 미구성 — 다른 모드엔 무영향)
    prefix: ${s3.prefix:dqe-stage}                # 객체 키 프리픽스 → s3://bucket/prefix/{job_id}/{task_id}.csv
    endpoint_url: ${s3.endpoint_url:}             # 온프렘 S3 호환(MinIO/Ceph) 엔드포인트. 비우면 AWS 기본
    region: ${s3.region:}                         # 리전(비우면 기본)
    access_key: ${s3.access_key:}                 # 업로드 자격증명(비우면 boto3 기본 체인). 비밀값
    secret_key: ${s3.secret_key:}                 # 업로드 자격증명. 비밀값
    use_ssl: ${s3.use_ssl:true}                   # 업로드 TLS 사용 여부
    pxf_server: ${s3.pxf_server:}                 # GP 읽기용 PXF SERVER 이름($PXF_BASE/servers/<server>/s3-site.xml 에 자격증명)
    pxf_profile: ${s3.pxf_profile:s3:csv}         # PXF 프로파일(기본 s3:csv)
    gp_location_template: ${s3.gp_location_template:}  # 고급: LOCATION raw override({bucket}/{key}/{profile}/{server} 치환)
    delete_on_cleanup: ${s3.delete_on_cleanup:true}    # 적재 성공/실패 후 S3 객체 정리 여부
