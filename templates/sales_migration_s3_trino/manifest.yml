# 쿼리 템플릿 예제 — 일별 매출 **Trino**→Greenplum 이관(s3_stage, S3 경유 스테이징).
#
# sales_migration_s3 과 하는 일이 같고 **소스 엔진만 다르다**(Impala → Trino). 바뀌는 것은
# 두 가지뿐이다:
#   1. manifest 의 datasource: trino  — executor 가 SELECT 를 읽을 엔진(DESIGN §17.2)
#   2. select.sql.j2 의 방언          — 날짜 리터럴/테이블 3단 이름
# 적재(Greenplum)·exec_mode·분할·Phase 2(PXF 외부테이블→target INSERT)·Phase 3(S3 정리)는
# 전혀 바뀌지 않는다. insert/external_columns 조각은 sales_migration_s3 과 사실상 동일하다.
#
# 사전 준비(운영):
#   - executor config 에 **Trino 소스 접속 함수**를 등록한다(이게 없으면 task 가 명확한
#     오류로 실패한다 — Impala 로 조용히 폴백하지 않는다):
#       query.func.trino.connect=customs.query_funcs.trino_runner:connect
#       query.func.trino.config.host=trino.example.com
#       query.func.trino.config.port=8080
#       query.func.trino.config.catalog=hive
#       query.func.trino.config.schema=default
#     (같은 블록의 query.func.trino.module=...:run 은 query-execute 용이며 이관과 무관하다.
#      run() 은 limit 으로 결과를 자르는 미리보기 계약이라 이관에는 쓰이지 않는다.)
#   - executor config 의 s3.* (bucket/prefix/endpoint_url/자격증명) — Phase 1 업로드용.
#   - GP 세그먼트에 PXF SERVER(s3.pxf_server) 구성 — Phase 2 읽기용.
#   - 대상 테이블(public.sales)과, s3.external_schema 를 쓴다면 그 스키마가 GP 에 미리 있어야 한다.
#
# 요청 예:
#   {"template_id": "sales_migration_s3_trino",
#    "params": [{"name":"start_dt","value":"2026-07-01"},
#               {"name":"end_dt","value":"2026-07-03"}],
#    "parallelism": 3}
#
# 소스만 Impala 로 되돌려 같은 템플릿을 돌리고 싶으면 요청에 "datasource": "impala" 를 주면
# 된다(요청 > manifest > source.type). 단 select 조각이 Trino 방언이라 Impala 에서는 그대로는
# 안 돈다 — 방언까지 바꾸려면 sales_migration_s3 를 쓴다.

id: sales_migration_s3_trino
description: 일별 매출 Trino→Greenplum 이관(s3_stage — 소스만 Trino, 적재는 동일)

# ── 소스 엔진 ──
# 이 템플릿의 SELECT 를 읽을 엔진. executor 는 query.func.trino.connect 가 돌려주는 DB-API
# 연결의 커서를 fetchmany 로 돌며 CSV 로 스트리밍한다(행수 제한 없음).
# sql_dialect 는 생략한다 — datasource=trino 에서 trino 방언이 자동 유도된다(parser.resolve_dialect).
datasource: trino

# ── 실행 방식/분할/적재 스칼라(요청에서 재정의 가능) ──
exec_mode: s3_stage                # SELECT → 로컬 CSV → S3 → PXF 외부테이블 → target INSERT
partition_column: dt               # 이 컬럼의 IN 목록을 splitter 가 분할
target_table: public.sales         # 최종 적재 대상(Greenplum)
staging_table: stg_sales_s3_trino  # insert_sql 의 FROM 이 참조하는 이름. Phase 2 에 외부테이블명으로 치환된다
write_mode: overwrite_partitions   # 담당 파티션 선삭제 후 적재(재실행 멱등)
strict_validation: false           # 렌더 SELECT 가 복합 쿼리일 수 있어 lenient 로 둔다

# 파라미터 스키마 — 필수/타입/기본값을 선언한다. 렌더 전 검증에 쓰인다.
params:
  - {name: start_dt, type: date, required: true}    # 시작일(YYYY-MM-DD)
  - {name: end_dt,   type: date, required: true}    # 종료일(YYYY-MM-DD)
  - {name: regions,  type: list, required: false, default: []}   # 지역 필터(비면 전체)
  # Trino 의 3단 테이블 이름(<catalog>.<schema>.<table>) 구성 요소. 접속의 기본
  # catalog/schema 에 기대지 않고 명시하려고 파라미터로 뺐다(요청에서 덮어쓸 수 있다).
  - {name: source_catalog, type: string, required: false, default: hive}
  - {name: source_schema,  type: string, required: false, default: default}

# role → 조각 파일 매핑. s3_stage 는 select(필수) + insert(필수) + external_columns(필수).
#   staging_ddl 은 쓰지 않는다(외부테이블이 staging 을 겸한다).
files:
  select:           select.sql.j2
  insert:           insert.sql.j2
  external_columns: external_columns.sql.j2
