# query-count 예제 템플릿(Trino) — 고객 정보를 붙인 주문의 건수.
#
# order_count 와 하는 일이 같고 **SELECT 를 읽는 엔진만 다르다**. 바뀌는 것은 둘뿐이다.
#   1. manifest 의 datasource: trino 와 sql_dialect: trino — 요청에서 따로 주지 않아도 이 값이 쓰인다
#      (우선순위는 요청 > manifest > 서버 설정이다).
#   2. select.sql.j2 의 방언(dialect) — 3단 테이블 이름과 DATE '...' 리터럴을 쓴다.
#
# 소스 실행은 executor 의 /query-run 이 맡고, 실제로 Trino 에 붙는 것은 executor 설정의
# 커스텀 함수다. 이 템플릿을 쓰려면 executor config 에 다음을 둔다.
#
#   query.func.module=customs.query_funcs.trino_runner:run
#   query.func.config.host=trino.example.com
#   query.func.config.port=8080
#   query.func.config.user=query-executor
#   # 커서 대신 사내 DataFrame API 를 쓴다면
#   # query.func.config.dataframe_module=mycorp.trino_api:query
#
# 요청 예:
#   {"template_id": "order_count_trino",
#    "params": [{"name": "regions",  "value": ["KR", "US"]},
#               {"name": "start_dt", "value": "2026-01-01"},
#               {"name": "end_dt",   "value": "2026-01-31"}]}
#
# 같은 템플릿을 POST /query-execute 로 보내면 상위 N행을 미리 볼 수 있다. 조인한 두 테이블의
# 겹치는 컬럼에 별칭을 붙이는 이유는 order_count 의 설명과 같다(COUNT 로 감쌀 때 출력 컬럼
# 이름이 겹치면 엔진이 거절한다).

id: order_count_trino
description: 고객을 붙인 주문 건수(Trino, query-count 예제) — region IN 목록 + 주문일 BETWEEN + 선택 등급

# ── 소스 엔진과 파서 방언(dialect) ──
# datasource 는 "누가 실행하나", sql_dialect 는 "coordinator 가 어떤 문법으로 검증하나"다.
# 서로 다른 축이므로 Trino 템플릿은 둘 다 적는다.
datasource: trino
sql_dialect: trino

# query-count·query-execute 는 select 조각만 렌더하지만, manifest 규약상 exec_mode 를 둔다(copy).
exec_mode: copy
strict_validation: false            # 렌더 SELECT 에 JOIN 이 있어 lenient 로 둔다

# 파라미터 스키마 — 필수/타입/기본값을 선언한다. 렌더 전 검증에 쓰인다.
params:
  - {name: regions,  type: list,   required: true}               # 주문 지역 IN 목록(N개)
  - {name: start_dt, type: date,   required: true}               # 주문일 BETWEEN 시작(YYYY-MM-DD)
  - {name: end_dt,   type: date,   required: true}               # 주문일 BETWEEN 종료(YYYY-MM-DD)
  - {name: grade,    type: string, required: false, default: ""} # 고객 등급(빈 값=조건 생략)
  # Trino 의 3단 테이블 이름(<catalog>.<schema>.<table>) 구성 요소다. 접속의 기본
  # catalog/schema 에 기대지 않고 명시하려고 파라미터로 뺐다(요청에서 덮어쓸 수 있다).
  - {name: source_catalog, type: string, required: false, default: hive}
  - {name: source_schema,  type: string, required: false, default: default}

# role → 조각 파일 매핑. 건수 조회는 select 만 있으면 된다.
files:
  select: select.sql.j2
