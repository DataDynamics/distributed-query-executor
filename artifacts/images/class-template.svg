<text x="28" y="766" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">렌더 결과는 기존 요청 필드에 주입되므로 그 뒤의 parser → splitter → dispatch 경로는 바뀌지 않는다.</text>
