<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 620" width="1420" height="620" role="img" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs>
<marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#334155" stroke-width="1.6"/></marker>
<marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/></marker>
<marker id="dia" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="13" markerHeight="10" orient="auto-start-reverse"><path d="M0 5 L6.5 0 L13 5 L6.5 10 z" fill="#334155"/></marker>
</defs>
<rect x="0" y="0" width="1420" height="620" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">시퀀스 — POST /query-execute 로 결과를 바로 받기</text>
<text x="28" y="60" font-size="13" fill="#64748b">coordinator 가 가장 한가한 executor 를 골라 프록시하므로 클라이언트는 executor 를 알 필요가 없다</text>
<line x1="105.0" y1="130" x2="105.0" y2="594" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="300.0" y1="130" x2="300.0" y2="594" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="495.0" y1="130" x2="495.0" y2="594" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="707.5" y1="130" x2="707.5" y2="594" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="915.0" y1="130" x2="915.0" y2="594" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="1102.5" y1="130" x2="1102.5" y2="594" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="1310.0" y1="130" x2="1310.0" y2="594" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="30" y="90" width="150" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.7"/>
<text x="105.0" y="115" font-size="13" fill="#475569" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">클라이언트</text>
<rect x="220" y="90" width="160" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<text x="300.0" y="115" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">coordinator</text>
<rect x="410" y="90" width="170" height="40" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
<text x="495.0" y="115" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">TemplateEngine</text>
<rect x="620" y="90" width="175" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<text x="707.5" y="115" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">ExecutorSelector</text>
<rect x="840" y="90" width="150" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
<text x="915.0" y="115" font-size="13" fill="#047857" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">executor</text>
<rect x="1010" y="90" width="185" height="40" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.7"/>
<text x="1102.5" y="115" font-size="13" fill="#a16207" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">query.func.module</text>
<rect x="1225" y="90" width="170" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.7"/>
<text x="1310.0" y="115" font-size="13" fill="#334155" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">Trino · 사내 API</text>
<line x1="105.0" y1="152" x2="300.0" y2="152" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="202.5" y="145" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">POST /query-execute  { template_id, params, limit }</text>
<line x1="300.0" y1="180" x2="495.0" y2="180" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="397.5" y="173" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">render_query(template_id, params) — select 부분만</text>
<line x1="495.0" y1="208" x2="300.0" y2="208" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="397.5" y="201" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">SELECT …</text>
<rect x="220" y="234" width="640" height="24" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="230" y="250" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">datasource 가 greenplum 이나 history 면 coordinator 가 직접 실행하고 executed_by 는 null 이다.</text>
<line x1="300.0" y1="282" x2="707.5" y2="282" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="503.75" y="275" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">가장 한가한 executor</text>
<line x1="707.5" y1="310" x2="300.0" y2="310" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="503.75" y="303" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">executor URL</text>
<line x1="300.0" y1="338" x2="915.0" y2="338" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="607.5" y="331" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">POST /query-run  { sql, limit, datasource }</text>
<line x1="915.0" y1="366" x2="1102.5" y2="366" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="1008.75" y="359" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">run(sql, config, limit)</text>
<line x1="1102.5" y1="394" x2="1310.0" y2="394" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="1206.25" y="387" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">드라이버나 사내 API 호출</text>
<line x1="1310.0" y1="422" x2="1102.5" y2="422" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1206.25" y="415" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">DataFrame · records</text>
<line x1="1102.5" y1="450" x2="915.0" y2="450" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1008.75" y="443" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">정형 전 결과</text>
<line x1="915.0" y1="478" x2="300.0" y2="478" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="607.5" y="471" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">{ columns, rows, truncated }</text>
<line x1="300.0" y1="506" x2="105.0" y2="506" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="202.5" y="499" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">200  { rows, row_count, elapsed_ms, executed_by }</text>
<rect x="220" y="532" width="800" height="24" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="230" y="548" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">결과가 limit 에서 잘리는 preview 라 이관에 쓰면 잘린 데이터가 적재된다. 옮기는 일은 POST /jobs 로 한다.</text>
</svg>
