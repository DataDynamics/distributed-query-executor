<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 758" width="1280" height="758" role="img" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs>
<marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#334155" stroke-width="1.6"/></marker>
<marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/></marker>
<marker id="dia" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="13" markerHeight="10" orient="auto-start-reverse"><path d="M0 5 L6.5 0 L13 5 L6.5 10 z" fill="#334155"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="758" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">시퀀스 — 취소와 재실행</text>
<text x="28" y="60" font-size="13" fill="#64748b">취소는 저장소에 표시해 두면 각 단계가 그것을 보고 멈추고, 재실행은 실패한 task 만 모아 새 job 을 만든다</text>
<line x1="105.0" y1="130" x2="105.0" y2="732" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="310.0" y1="130" x2="310.0" y2="732" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="500.0" y1="130" x2="500.0" y2="732" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="685.0" y1="130" x2="685.0" y2="732" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="875.0" y1="130" x2="875.0" y2="732" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="1060.0" y1="130" x2="1060.0" y2="732" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="30" y="90" width="150" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.7"/>
<text x="105.0" y="115" font-size="13" fill="#475569" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">클라이언트</text>
<rect x="230" y="90" width="160" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<text x="310.0" y="115" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">coordinator</text>
<rect x="430" y="90" width="140" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.7"/>
<text x="500.0" y="115" font-size="13" fill="#334155" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">JobStore</text>
<rect x="610" y="90" width="150" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<text x="685.0" y="115" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">dispatcher</text>
<rect x="800" y="90" width="150" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
<text x="875.0" y="115" font-size="13" fill="#047857" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">executor</text>
<rect x="990" y="90" width="140" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.7"/>
<text x="1060.0" y="115" font-size="13" fill="#334155" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">job_history</text>
<line x1="105.0" y1="182" x2="310.0" y2="182" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="207.5" y="175" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">POST /jobs/{job_id}/cancel</text>
<line x1="310.0" y1="210" x2="500.0" y2="210" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="405.0" y="203" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">request_cancel(job_id) — 취소 표시</text>
<line x1="310.0" y1="238" x2="685.0" y2="238" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="497.5" y="231" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">cancel(job)</text>
<line x1="685.0" y1="266" x2="875.0" y2="266" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="780.0" y="259" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">POST /tasks/{task_id}/cancel</text>
<path d="M875.0,294 h46 v22 h-46" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="931.0" y="304" font-size="12" fill="#334155" text-anchor="start" font-weight="400">실행 중이면 중단하고 CANCELLED 로</text>
<path d="M685.0,340 h46 v22 h-46" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="741.0" y="350" font-size="12" fill="#334155" text-anchor="start" font-weight="400">폴링과 슬롯 대기에서도 취소를 확인한다</text>
<line x1="685.0" y1="386" x2="1060.0" y2="386" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="872.5" y="379" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">record(job) — CANCELLED</text>
<line x1="310.0" y1="414" x2="105.0" y2="414" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="207.5" y="407" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">200  경량 진행 뷰 (이미 끝난 job 이면 409)</text>
<rect x="20" y="148" width="1120" height="280" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="20" y="148" width="207.75000000000003" height="18" rx="4" fill="#7c3aed"/>
<text x="29" y="161" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="700">취소 — 진행 중인 job 에만 통한다</text>
<line x1="105.0" y1="476" x2="310.0" y2="476" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="207.5" y="469" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">POST /jobs/{job_id}/retry</text>
<line x1="310.0" y1="504" x2="500.0" y2="504" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="405.0" y="497" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">get(job_id) — 종료 상태 확인</text>
<line x1="500.0" y1="532" x2="310.0" y2="532" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="405.0" y="525" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">PARTIAL · FAILED · CANCELLED 여야 한다</text>
<path d="M310.0,560 h46 v22 h-46" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="366.0" y="570" font-size="12" fill="#334155" text-anchor="start" font-weight="400">실패하거나 취소된 task 만 모아 새 job 을 만든다</text>
<line x1="310.0" y1="606" x2="500.0" y2="606" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="405.0" y="599" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">claim_and_add(new_job)</text>
<line x1="310.0" y1="634" x2="105.0" y2="634" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="207.5" y="627" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">202  { job_id, retry_of, retried_tasks }</text>
<rect x="20" y="436" width="1120" height="212" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="20" y="436" width="207.75000000000003" height="18" rx="4" fill="#7c3aed"/>
<text x="29" y="449" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="700">재실행 — 성공한 task 는 건너뛴다</text>
<rect x="20" y="670" width="1000" height="24" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="30" y="686" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">다시 돌릴 task 가 없거나 job 이 아직 끝나지 않았으면 409 다. 정상적인 거절이지 오류가 아니다.</text>
</svg>
