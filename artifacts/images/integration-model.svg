<rect x="752" y="398" width="444" height="66" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="974.0" y="425.6666666666667" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">메타 저장소</text>
<text x="974.0" y="445.6666666666667" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">PostgreSQL — job · 이력 · 상태 · 예약 · 메트릭</text>
