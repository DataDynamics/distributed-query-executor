<rect x="0" y="0" width="1240" height="600" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">연계 논리 모델</text>
<text x="28" y="60" font-size="13" fill="#64748b">이 시스템이 무엇과 어떤 방식으로 주고받는지. 굵은 선은 데이터, 점선은 제어와 상태다.</text>
