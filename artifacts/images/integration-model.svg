<path d="M962,158 H982" stroke="#0f172a" stroke-width="2.6" fill="none" marker-end="url(#arw)"/>
<path d="M962,250 H982" stroke="#0f172a" stroke-width="2.6" fill="none" marker-end="url(#arw)"/>
<rect x="24" y="496" width="1192" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="620.0" y="520.6666666666666" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">연계 원칙</text>
<text x="620.0" y="540.6666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">데이터는 coordinator 를 지나지 않는다. executor 가 소스에서 읽어 대상이나 스테이징으로 곧장 보내고, coordinator 로는 상태와 행 수만 올라온다.</text>
<text x="620.0" y="560.6666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">소스 접속은 executor 만 하고, 외부테이블을 걸어 세그먼트가 스테이징을 당겨 읽게 하는 Phase 2 SQL 은 coordinator 가 중앙에서 실행한다.</text>
