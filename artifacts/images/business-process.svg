<path d="M763 892.0 L888.0 931 L763 970.0 L638.0 931 Z" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="763" y="936" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle">모든 몫이 담겼는가?</text>
<rect x="938" y="900" width="392" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="1134.0" y="925.6666666666666" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">실패한 몫만 다시 담는다</text>
<text x="1134.0" y="945.6666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">이미 담긴 몫은 그대로 둔다</text>
<rect x="628" y="996" width="270" height="54" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="763.0" y="1017.6666666666666" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">끝났음을 알린다</text>
<text x="763.0" y="1037.6666666666665" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">담은 건수를 함께 전달</text>
<rect x="318" y="1072" width="260" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="448.0" y="1093.6666666666667" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">완료를 표시하고</text>
<text x="448.0" y="1113.6666666666667" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">결과 화면을 연다</text>
<rect x="58" y="1148" width="200" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<text x="158.0" y="1173.6666666666667" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">차트와 표로</text>
<text x="158.0" y="1193.6666666666667" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">결과를 살펴본다</text>
<rect x="58" y="1232" width="200" height="54" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<text x="158.0" y="1253.6666666666667" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">보고서로 저장하거나</text>
<text x="158.0" y="1273.6666666666667" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">동료와 공유한다</text>
<circle cx="158" cy="1318" r="15" fill="none" stroke="#0f172a" stroke-width="2.2"/><circle cx="158" cy="1318" r="9" fill="#0f172a"/>
<rect x="938" y="1160" width="392" height="96" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="1134.0" y="1193.3333333333333" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">이 그림에서 말하는 창고</text>
<text x="1134.0" y="1212.3333333333333" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">원천 시스템 = 업무 데이터가 쌓이는 큰 창고(Impala)</text>
<text x="1134.0" y="1231.3333333333333" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">분석용 창고 = 분석과 시각화 전용 데이터베이스(WarehousePG)</text>
