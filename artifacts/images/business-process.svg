<text x="158.0" y="227.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">기간 · 대상 · 항목</text>
<rect x="58" y="262" width="200" height="54" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<text x="158.0" y="293.6666666666667" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">‘추출’ 버튼을 누른다</text>
<rect x="318" y="338" width="260" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="448.0" y="359.6666666666667" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">입력한 조건을 확인한다</text>
<text x="448.0" y="379.6666666666667" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">빠진 값 · 잘못된 기간</text>
<path d="M448 409.0 L558.0 446 L448 483.0 L338.0 446 Z" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="448" y="451" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle">조건이 올바른가?</text>
<rect x="58" y="414" width="200" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<text x="158.0" y="439.6666666666667" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">안내를 보고</text>
<text x="158.0" y="459.6666666666667" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">조건을 고친다</text>
<rect x="318" y="500" width="260" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="448.0" y="521.6666666666666" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">추출을 요청한다</text>
<text x="448.0" y="541.6666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">필요한 데이터를 알려 준다</text>
<rect x="628" y="576" width="270" height="54" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="763.0" y="597.6666666666666" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">요청을 접수하고</text>
<text x="763.0" y="617.6666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">접수번호를 돌려준다</text>
<rect x="318" y="652" width="260" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="448.0" y="673.6666666666666" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">진행 상태를 보여 준다</text>
<text x="448.0" y="693.6666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">몇 %까지 왔는지 표시</text>
<rect x="628" y="652" width="270" height="54" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="763.0" y="673.6666666666666" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">일을 여러 몫으로 나눈다</text>
<text x="763.0" y="693.6666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">기본 4몫 — 몫마다 동시에</text>
<rect x="938" y="728" width="382" height="7" rx="3" fill="#0f172a"/>
<rect x="938" y="752" width="180" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1028.0" y="780.3333333333334" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">1번 몫</text>
<text x="1028.0" y="799.3333333333334" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">원천 시스템에서 읽어</text>
<text x="1028.0" y="818.3333333333334" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">분석용 창고에 담는다</text>
<rect x="1140" y="752" width="180" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1230.0" y="780.3333333333334" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">2번 몫</text>
<text x="1230.0" y="799.3333333333334" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">원천 시스템에서 읽어</text>
<text x="1230.0" y="818.3333333333334" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">분석용 창고에 담는다</text>
