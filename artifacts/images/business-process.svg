<rect x="0" y="0" width="1400" height="1372" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">비즈니스 프로세스 — 데이터 추출부터 시각화까지</text>
<text x="28" y="60" font-size="13" fill="#64748b">현업 담당자가 분석 화면에서 추출을 요청하면 원천 데이터가 분석용 데이터베이스로 옮겨지고, 그 데이터로 차트를 그린다</text>
