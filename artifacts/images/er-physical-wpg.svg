<text x="770" y="250" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">같은 job 의 행이 한 세그먼트에 모여</text>
<text x="770" y="266" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">DISTINCT ON 이 motion 없이 끝난다</text>
