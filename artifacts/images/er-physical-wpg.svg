<text x="444" y="478" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">n · updated_at</text>
<text x="710" y="478" font-size="10.5" fill="#94a3b8" text-anchor="end" font-weight="400" font-family="'JetBrains Mono','D2Coding','Consolas',monospace"></text>
