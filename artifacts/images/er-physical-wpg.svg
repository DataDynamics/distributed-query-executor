<rect x="1120" y="400" width="260" height="188" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="1136" y="424" font-size="13" fill="#92400e" text-anchor="start" font-weight="700">왜 이렇게 바뀌는가</text>
<text x="1136" y="448" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">분산키를 정하지 않으면 첫 컬럼이나</text>
<text x="1136" y="467" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">랜덤으로 잡혀 데이터가 한쪽으로</text>
<text x="1136" y="486" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">몰릴 수 있다.</text>
<text x="1136" y="505" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400"></text>
<text x="1136" y="524" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">이력 테이블에 대리키 PK 를 두면</text>
<text x="1136" y="543" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">분산키가 (id) 로 강제되어 job 단위</text>
<text x="1136" y="562" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">조회가 전 세그먼트로 흩어진다.</text>
<text x="40" y="630" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">메타 저장소를 WarehousePG 에 둘 때는 config/warehousepg.sql 을 대신 적용한다. 앱이 쓰는 SQL 은 ON CONFLICT·JSONB·</text>
<text x="40" y="650" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">DISTINCT ON 뿐이고 Greenplum 7 은 PostgreSQL 12 엔진이라 그대로 동작하므로, 바꿔야 하는 것은 이 스키마 파일뿐이다.</text>
<text x="40" y="690" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">다만 executor_status 와 coordinator_status, executor_reservation 은 수 초 간격의 단일 행 UPSERT 라 MPP 의 강점과는</text>
<text x="40" y="710" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">반대되는 워크로드다. 볼륨이 작아 동작은 하지만, 성능이 중요하면 메타 저장소는 일반 PostgreSQL 에 두고 WarehousePG 는</text>
<text x="40" y="730" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">데이터 적재 대상으로만 쓰는 편이 낫다.</text>
</svg>
