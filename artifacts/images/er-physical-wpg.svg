<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">물리 ER — WarehousePG(Greenplum 7) 판</text>
<text x="28" y="60" font-size="13" fill="#64748b">같은 일곱 테이블이지만 MPP 규칙에 맞춰 분산키를 정하고 이력 테이블의 대리키를 뺐다. 앱 코드는 그대로 동작한다.</text>
