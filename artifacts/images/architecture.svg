<line x1="762" y1="240" x2="858" y2="320" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<text x="810" y="122" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">읽기</text>
<text x="810" y="190" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">적재</text>
<text x="806" y="264" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">업로드</text>
<path d="M452,224 H478 V430 H970 V270" stroke="#334155" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="710" y="422" font-size="12" fill="#475569" text-anchor="middle">Phase 2 — 외부테이블 생성과 target INSERT 는 coordinator 가 중앙에서 한다</text>
<rect x="24" y="352" width="400" height="150" rx="12" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="36" y="371" font-size="12" font-weight="700" fill="#64748b">터미널 도구 — 서비스와 별개로 사람이 직접 쓴다</text>
<rect x="40" y="382" width="112" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="96.0" y="407.3333333333333" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">gp-shell</text>
<rect x="162" y="382" width="124" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="224.0" y="407.3333333333333" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">impala-shell</text>
<rect x="296" y="382" width="100" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="346.0" y="407.3333333333333" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">s3-ops</text>
<text x="40" y="452" font-size="12" fill="#475569" text-anchor="start" font-weight="400">같은 config.properties 를 읽으므로</text>
<text x="40" y="472" font-size="12" fill="#475569" text-anchor="start" font-weight="400">접속 정보를 두 번 적을 필요가 없다</text>
<path d="M424,462 H1020 V366" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arm)"/>
<text x="730" y="454" font-size="12" fill="#475569" text-anchor="middle">사람이 직접 조회하고 정리한다</text>
