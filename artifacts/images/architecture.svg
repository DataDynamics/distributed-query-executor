<rect x="554" y="124" width="192" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="650.0" y="146.66666666666666" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">executor #1</text>
<text x="650.0" y="166.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">:8087</text>
<rect x="554" y="200" width="192" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="650.0" y="222.66666666666666" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">executor #2</text>
<text x="650.0" y="242.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">:8086</text>
<text x="650" y="300" font-size="12" fill="#059669" text-anchor="middle" font-weight="400">… 처리량은 인스턴스 수로 늘린다</text>
