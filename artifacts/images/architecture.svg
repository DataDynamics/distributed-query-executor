<text x="207.0" y="175.0" font-size="12" fill="#475569" text-anchor="middle">POST /jobs</text>
<line x1="452" y1="160" x2="552" y2="150" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="502.0" y="145.0" font-size="12" fill="#475569" text-anchor="middle">POST /tasks</text>
<line x1="452" y1="216" x2="552" y2="230" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="484.0" y="249.0" font-size="12" fill="#475569" text-anchor="middle">상태 폴링</text>
