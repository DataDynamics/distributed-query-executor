<text x="352.0" y="182.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">:8088</text>
<text x="352.0" y="202.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">검증 → 분할 → admission</text>
<text x="352.0" y="222.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">상태·행 수 집계</text>
