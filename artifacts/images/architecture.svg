<rect x="0" y="0" width="1100" height="540" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">분산 쿼리 실행기 전체 구성</text>
<text x="28" y="60" font-size="13" fill="#64748b">굵은 선은 데이터가 실제로 흐르는 길이고, 점선은 상태와 지시만 오가는 길이다</text>
