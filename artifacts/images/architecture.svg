<rect x="860" y="190" width="200" height="76" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="960.0" y="222.66666666666666" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">Greenplum</text>
<text x="960.0" y="242.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">적재 대상</text>
