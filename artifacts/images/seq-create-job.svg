<rect x="210" y="566" width="620" height="24" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="220" y="582" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">False 면 429 + Retry-After 로 거절하고 job 을 만들지 않는다.</text>
