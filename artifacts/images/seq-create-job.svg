<rect x="210" y="448" width="620" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="220" y="464" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">검증에 걸리면 여기서 422 + error_code 로 끝난다. task_params 를 주면 IN 분할 대신 날짜 fan-out 을 편다.</text>
<line x1="290.0" y1="512" x2="892.5" y2="512" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="591.25" y="505" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">try_admit()</text>
