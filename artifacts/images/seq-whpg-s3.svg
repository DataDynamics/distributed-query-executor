<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 894" width="1340" height="894" role="img" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs>
<marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#334155" stroke-width="1.6"/></marker>
<marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/></marker>
<marker id="dia" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="13" markerHeight="10" orient="auto-start-reverse"><path d="M0 5 L6.5 0 L13 5 L6.5 10 z" fill="#334155"/></marker>
</defs>
<rect x="0" y="0" width="1340" height="894" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">시퀀스 — whpg-to-whpg 의 s3 모드 복사</text>
<text x="28" y="60" font-size="13" fill="#64748b">세그먼트가 S3 를 직접 읽고 쓴다. 도구는 SQL 만 던지고 데이터는 도구를 지나지 않는다.</text>
<line x1="105.0" y1="130" x2="105.0" y2="868" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="295.0" y1="130" x2="295.0" y2="868" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="490.0" y1="130" x2="490.0" y2="868" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="702.5" y1="130" x2="702.5" y2="868" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="880.0" y1="130" x2="880.0" y2="868" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="1070.0" y1="130" x2="1070.0" y2="868" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="1262.5" y1="130" x2="1262.5" y2="868" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="30" y="90" width="150" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<text x="105.0" y="115" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">whpg-copy</text>
<rect x="220" y="90" width="150" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<text x="295.0" y="115" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">copyplan</text>
<rect x="400" y="90" width="180" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.7"/>
<text x="490.0" y="115" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">소스 WarehousePG</text>
<rect x="620" y="90" width="165" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.7"/>
<text x="702.5" y="115" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">소스 세그먼트</text>
<rect x="820" y="90" width="120" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.7"/>
<text x="880.0" y="115" font-size="13" fill="#334155" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">S3</text>
<rect x="980" y="90" width="180" height="40" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.7"/>
<text x="1070.0" y="115" font-size="13" fill="#a16207" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">타깃 WarehousePG</text>
<rect x="1190" y="90" width="145" height="40" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.7"/>
<text x="1262.5" y="115" font-size="13" fill="#a16207" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">타깃 세그먼트</text>
<line x1="105.0" y1="152" x2="295.0" y2="152" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="200.0" y="145" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">preflight(plan, source, target)</text>
<line x1="295.0" y1="180" x2="490.0" y2="180" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="392.5" y="173" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">s3 프로토콜 등록 확인</text>
<line x1="295.0" y1="208" x2="880.0" y2="208" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="587.5" y="201" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">접두사가 비었는지 확인 · 작은 객체로 왕복 시험</text>
<line x1="295.0" y1="236" x2="105.0" y2="236" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="200.0" y="229" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">통과 또는 PreflightError</text>
<rect x="30" y="262" width="780" height="24" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="40" y="278" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">자격증명과 경로 문제를 데이터를 다 뽑은 뒤에 알게 되는 것을 막는다.</text>
<line x1="105.0" y1="340" x2="490.0" y2="340" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="297.5" y="333" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">CREATE WRITABLE EXTERNAL TEMP TABLE … LOCATION('s3://…')</text>
<line x1="105.0" y1="368" x2="490.0" y2="368" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="297.5" y="361" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">INSERT INTO 외부테이블 SELECT …</text>
<line x1="490.0" y1="396" x2="702.5" y2="396" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="596.25" y="389" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">세그먼트마다 자기 몫을 내보낸다</text>
<line x1="702.5" y1="424" x2="880.0" y2="424" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="791.25" y="417" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">CSV 객체 업로드</text>
<line x1="490.0" y1="452" x2="105.0" y2="452" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="297.5" y="445" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">언로드 행 수</text>
<rect x="20" y="306" width="900" height="160" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="20" y="306" width="239.95000000000002" height="18" rx="4" fill="#7c3aed"/>
<text x="29" y="319" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="700">언로드 — 데이터는 도구를 지나지 않는다</text>
<line x1="105.0" y1="510" x2="1070.0" y2="510" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="587.5" y="503" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">BEGIN</text>
<line x1="105.0" y1="538" x2="1070.0" y2="538" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="587.5" y="531" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">CREATE READABLE EXTERNAL TEMP TABLE … LOCATION('s3://…')</text>
<line x1="105.0" y1="566" x2="1070.0" y2="566" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="587.5" y="559" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">INSERT INTO 타깃 SELECT * FROM 외부테이블</text>
<line x1="1070.0" y1="594" x2="1262.5" y2="594" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="1166.25" y="587" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">세그먼트가 객체를 나눠 읽는다</text>
<line x1="1262.5" y1="622" x2="880.0" y2="622" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="1071.25" y="615" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">GetObject</text>
<line x1="1070.0" y1="650" x2="105.0" y2="650" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="587.5" y="643" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">적재 행 수</text>
<rect x="20" y="476" width="1240" height="188" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="20" y="476" width="287.1" height="18" rx="4" fill="#7c3aed"/>
<text x="29" y="489" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="700">로드 — 적재가 문장 하나라 그 자체로 원자적이다</text>
<path d="M105.0,706 h46 v22 h-46" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="161.0" y="716" font-size="12" fill="#334155" text-anchor="start" font-weight="400">verify — 두 행 수를 비교</text>
<line x1="105.0" y1="752" x2="1070.0" y2="752" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="587.5" y="745" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">COMMIT 또는 ROLLBACK</text>
<line x1="105.0" y1="780" x2="880.0" y2="780" stroke="#0f172a" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="492.5" y="773" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">성공했을 때만 실행 접두사를 지운다</text>
<rect x="30" y="806" width="980" height="24" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="40" y="822" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">실패하면 남기고 s3-ops 로 지우는 명령을 찍어 준다. 재개할 때는 매니페스트를 읽어 언로드를 건너뛴다.</text>
</svg>
