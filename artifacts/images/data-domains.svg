<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 662" width="1240" height="662" role="img" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Nanum Gothic',sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="662" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">데이터 세 갈래 — 소유 관계로 가른다</text>
<text x="28" y="60" font-size="13" fill="#64748b">이 시스템이 소유하는 것은 맨 아래 한 갈래뿐이다</text>
<rect x="28" y="84" width="1184" height="152" rx="12" fill="none" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="40" y="103" font-size="12" font-weight="700" fill="#ea580c">이관 데이터 — 통과한다</text>
<rect x="52" y="118" width="210" height="84" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="157.0" y="154.66666666666666" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">소스</text>
<text x="157.0" y="174.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Impala · Trino · 사내 API</text>
<rect x="352" y="118" width="210" height="84" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="457.0" y="154.66666666666666" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">executor</text>
<text x="457.0" y="174.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">읽어서 그대로 넘긴다</text>
<rect x="652" y="118" width="210" height="84" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="757.0" y="154.66666666666666" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">적재 대상</text>
<text x="757.0" y="174.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Greenplum 계열</text>
<line x1="266" y1="160" x2="348" y2="160" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<text x="307.0" y="152.0" font-size="12" fill="#475569" text-anchor="middle">읽기</text>
<line x1="566" y1="160" x2="648" y2="160" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<text x="607.0" y="152.0" font-size="12" fill="#475569" text-anchor="middle">적재</text>
<rect x="900" y="118" width="288" height="84" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="1044.0" y="154.83333333333334" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">이 시스템의 것이 아니다</text>
<text x="1044.0" y="173.83333333333334" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">보관하지 않고 스키마도 요청이 정한다</text>
<rect x="28" y="252" width="1184" height="158" rx="12" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="40" y="271" font-size="12" font-weight="700" fill="#64748b">중간 데이터 — 실행 중에만 있다</text>
<rect x="52" y="288" width="264" height="76" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="184.0" y="320.8333333333333" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">세그먼트 로컬 CSV</text>
<text x="184.0" y="339.8333333333333" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">&lt;stage.local_dir&gt;/&lt;job_id&gt;/f&lt;i&gt;.csv</text>
<rect x="340" y="288" width="264" height="76" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="472.0" y="320.8333333333333" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">S3 객체</text>
<text x="472.0" y="339.8333333333333" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">&lt;prefix&gt;/&lt;job_id&gt;/&lt;task_id&gt;.csv</text>
<rect x="628" y="288" width="264" height="76" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="760.0" y="320.8333333333333" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">staging TEMP</text>
<text x="760.0" y="339.8333333333333" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">stage_insert 의 임시 테이블</text>
<rect x="916" y="288" width="264" height="76" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="1048.0" y="320.8333333333333" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">외부테이블</text>
<text x="1048.0" y="339.8333333333333" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">s3ext_&lt;job_id&gt; · file://</text>
<text x="52" y="392" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">적재가 끝나면 지운다. 남더라도 재실행으로 다시 만들어지므로 백업 대상이 아니다.</text>
<rect x="28" y="426" width="1184" height="208" rx="12" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="40" y="445" font-size="12" font-weight="700" fill="#2563eb">메타 데이터 — 유일하게 소유한다</text>
<text x="52" y="470" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">상태 — 지금 어떤가</text>
<rect x="52" y="480" width="264" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="184.0" y="506.3333333333333" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">jobs</text>
<rect x="340" y="480" width="264" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="472.0" y="506.3333333333333" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">executor_status</text>
<rect x="628" y="480" width="264" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="760.0" y="506.3333333333333" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">executor_reservation</text>
<rect x="916" y="480" width="264" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="1048.0" y="506.3333333333333" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">coordinator_status</text>
<text x="52" y="556" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">이력·계측 — 무엇이 있었나</text>
<rect x="52" y="566" width="264" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="184.0" y="592.3333333333334" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">job_history</text>
<rect x="340" y="566" width="264" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="472.0" y="592.3333333333334" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">task_history</text>
<rect x="628" y="566" width="264" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="760.0" y="592.3333333333334" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">executor_health_metrics</text>
<text x="908" y="594" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">앱은 오래된 행을 지우지 않는다</text>
</svg>
