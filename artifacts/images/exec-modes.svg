<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 690" width="1130" height="690" role="img" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Nanum Gothic',sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect x="0" y="0" width="1130" height="690" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">exec_mode 다섯 가지 — 같은 요청, 다른 데이터 경로</text>
<text x="28" y="60" font-size="13" fill="#64748b">요청 스키마는 하나이고 exec_mode 필드가 어느 파이프라인으로 실행할지 정한다</text>
<rect x="24" y="92" width="176" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="112.0" y="113.66666666666667" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">copy</text>
<text x="112.0" y="133.66666666666669" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">기본값 · overwrite 지원</text>
<rect x="224" y="96" width="150" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="299.0" y="123.33333333333333" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">소스</text>
<line x1="374" y1="119" x2="402" y2="119" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="402" y="96" width="150" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="477.0" y="123.33333333333333" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">executor</text>
<line x1="552" y1="119" x2="580" y2="119" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="580" y="96" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="655.0" y="123.33333333333333" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">Greenplum</text>
<text x="224" y="166" font-size="12" fill="#475569" text-anchor="start" font-weight="400">추가 필드가 없다. write_mode 로 재실행 멱등이 성립한다.</text>
<rect x="24" y="208" width="176" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="112.0" y="229.66666666666666" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">statement</text>
<text x="112.0" y="249.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">스트림 없음</text>
<rect x="224" y="212" width="150" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="299.0" y="239.33333333333334" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">coordinator</text>
<line x1="374" y1="235" x2="402" y2="235" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="402" y="212" width="150" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="477.0" y="239.33333333333334" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">executor</text>
<line x1="552" y1="235" x2="580" y2="235" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="580" y="212" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="655.0" y="239.33333333333334" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">대상에서 SQL 실행</text>
<text x="224" y="282" font-size="12" fill="#475569" text-anchor="start" font-weight="400">받은 INSERT 를 대상이 스스로 실행한다. COPY 스트림이 아예 없다.</text>
<rect x="24" y="324" width="176" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="112.0" y="345.6666666666667" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">stage_insert</text>
<text x="112.0" y="365.6666666666667" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">항상 append</text>
<rect x="224" y="328" width="150" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="299.0" y="355.3333333333333" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">소스</text>
<line x1="374" y1="351" x2="402" y2="351" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="402" y="328" width="150" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="477.0" y="355.3333333333333" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">executor</text>
<line x1="552" y1="351" x2="580" y2="351" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="580" y="328" width="150" height="46" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="655.0" y="355.3333333333333" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">staging(TEMP)</text>
<line x1="730" y1="351" x2="758" y2="351" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="758" y="328" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="833.0" y="355.3333333333333" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">target INSERT</text>
<text x="224" y="398" font-size="12" fill="#475569" text-anchor="start" font-weight="400">staging_table 과 wrapper_query 가 필수다. write_mode 를 적용하지 않는다.</text>
<rect x="24" y="440" width="176" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="112.0" y="461.6666666666667" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">local_stage</text>
<text x="112.0" y="481.6666666666667" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">세그먼트 co-locate 필요</text>
<rect x="224" y="444" width="150" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="299.0" y="471.3333333333333" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">소스</text>
<line x1="374" y1="467" x2="402" y2="467" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="402" y="444" width="150" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="477.0" y="471.3333333333333" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">executor</text>
<line x1="552" y1="467" x2="580" y2="467" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="580" y="444" width="150" height="46" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="655.0" y="471.3333333333333" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">세그먼트 로컬 CSV</text>
<line x1="730" y1="467" x2="758" y2="467" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="758" y="444" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="833.0" y="471.3333333333333" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">file:// 외부테이블</text>
<line x1="908" y1="467" x2="936" y2="467" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="936" y="444" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1011.0" y="471.3333333333333" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">target INSERT</text>
<text x="224" y="514" font-size="12" fill="#475569" text-anchor="start" font-weight="400">staging_table · external_columns · insert_sql 이 필수다.</text>
<rect x="24" y="556" width="176" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="112.0" y="577.6666666666666" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" font-family="'JetBrains Mono','D2Coding','Consolas',monospace">s3_stage</text>
<text x="112.0" y="597.6666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">배치 제약 없음</text>
<rect x="224" y="560" width="150" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="299.0" y="587.3333333333334" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">소스</text>
<line x1="374" y1="583" x2="402" y2="583" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="402" y="560" width="150" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="477.0" y="587.3333333333334" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">executor</text>
<line x1="552" y1="583" x2="580" y2="583" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<rect x="580" y="560" width="150" height="46" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="655.0" y="587.3333333333334" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">S3 객체</text>
<line x1="730" y1="583" x2="758" y2="583" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="758" y="560" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="833.0" y="587.3333333333334" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">PXF 외부테이블</text>
<line x1="908" y1="583" x2="936" y2="583" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="936" y="560" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1011.0" y="587.3333333333334" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">target INSERT</text>
<text x="224" y="630" font-size="12" fill="#475569" text-anchor="start" font-weight="400">필수 필드는 local_stage 와 같고 staging_ddl 은 주지 않는다.</text>
<text x="24" y="664" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">굵은 선은 executor 가 실제로 흘려보내는 데이터이고, 점선은 Greenplum 이 파일을 스스로 당겨 읽는 구간이다</text>
</svg>
