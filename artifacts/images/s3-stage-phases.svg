<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Nanum Gothic',sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="500" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">s3_stage 는 배리어를 사이에 둔 3단계로 돈다</text>
<text x="28" y="60" font-size="13" fill="#64748b">executor 는 올리기만 하고, 외부테이블 생성과 target INSERT 는 coordinator 가 중앙에서 한다</text>
<rect x="24" y="88" width="700" height="250" rx="12" fill="none" stroke="#059669" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="36" y="107" font-size="12" font-weight="700" fill="#059669">Phase 1 — executor 가 각자 올린다</text>
<rect x="44" y="126" width="150" height="52" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="119.0" y="156.33333333333334" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">executor #1</text>
<rect x="44" y="208" width="150" height="52" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="119.0" y="238.33333333333334" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">executor #2</text>
<rect x="226" y="126" width="150" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="301.0" y="156.33333333333334" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">로컬 CSV</text>
<rect x="226" y="208" width="150" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="301.0" y="238.33333333333334" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">로컬 CSV</text>
<rect x="430" y="140" width="274" height="106" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="567.0" y="177.66666666666666" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">S3 &lt;prefix&gt;/&lt;job_id&gt;/</text>
<text x="567.0" y="197.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">t_0.csv · t_1.csv · …</text>
<text x="567.0" y="217.66666666666666" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">업로드 뒤 로컬 파일은 지운다</text>
<line x1="196" y1="152" x2="222" y2="152" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<line x1="196" y1="234" x2="222" y2="234" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<line x1="378" y1="152" x2="426" y2="168" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<line x1="378" y1="234" x2="426" y2="220" stroke="#0f172a" stroke-width="2.6" marker-end="url(#arw)"/>
<line x1="754" y1="96" x2="754" y2="400" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
<text transform="rotate(-90 738 214)" x="738" y="214" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">배리어 — 업로드 완료까지 대기</text>
<rect x="790" y="88" width="300" height="250" rx="12" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="802" y="107" font-size="12" font-weight="700" fill="#2563eb">Phase 2 — coordinator 가 중앙에서</text>
<rect x="808" y="120" width="266" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="941.0" y="149.33333333333334" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">coordinator</text>
<rect x="808" y="194" width="266" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="941.0" y="214.0" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="middle">CREATE EXTERNAL TABLE</text>
<text x="941.0" y="232.0" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">s3ext_&lt;job_id&gt;</text>
<rect x="808" y="268" width="266" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="941.0" y="297.3333333333333" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">INSERT INTO target</text>
<line x1="941" y1="170" x2="941" y2="192" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="941" y1="244" x2="941" y2="266" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="24" y="400" width="1066" height="68" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="557.0" y="428.6666666666667" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Phase 3 — 정리</text>
<text x="557.0" y="448.6666666666667" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">s3.delete_on_cleanup 이 켜져 있으면 job 프리픽스를 지운다. Phase 2 가 실패하면 객체가 남으므로 원인을 고쳐 다시 돌릴 수 있고, 디버깅 중에는 정리를 꺼 두고 s3-ops 로 들여다본다.</text>
</svg>
