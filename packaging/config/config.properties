# Distributed Query Executor 설정 (Java 스타일 key=value)
# 운영 배포 시 /etc/query-executor/config.properties 로 복사해 사용한다.

app.name=distributed-query-executor
app.debug=false

# 로깅 (개발용 — 상대 경로 logs. 패키징 배포는 config.yml 기본값 /var/log/query-executor 사용)
log.level=INFO
log.dir=logs
log.backup_count=30
log.filename.coordinator=query-coordinator-server.log
log.filename.executor=query-executor-server.log

# ───────── Coordinator ─────────
coordinator.host=0.0.0.0
coordinator.port=8000
# executor 서비스 URL 목록(쉼표 구분). systemd 인스턴스 포트와 일치시킬 것.
coordinator.executors=http://127.0.0.1:8001,http://127.0.0.1:8002
coordinator.max_concurrent_jobs=16
coordinator.max_dispatch_concurrency=32
coordinator.poll_interval_s=1.0
coordinator.task_timeout_s=3600

# ───────── Executor ─────────
executor.host=0.0.0.0

# Executor - Impala (source). impala.host 가 비어 있으면 MockBackend 사용.
impala.host=
impala.port=21050
impala.database=default
impala.user=
impala.password=
impala.auth_mechanism=PLAIN
impala.use_ssl=false

# Executor - Greenplum (target). greenplum.dsn 이 비어 있으면 MockBackend 사용.
greenplum.dsn=
copy.batch_size=10000
