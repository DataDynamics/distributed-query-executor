# Distributed Query Executor 설정 (Java 스타일 key=value)
# 운영 배포 시 /appuser/query-executor/config/config.properties 로 복사해 사용한다.

app.name=distributed-query-executor
app.debug=false

# 쿼리 파싱 기본 방언(요청에서 sql_dialect 로 재정의 가능). 예: hive, impala, postgres
query.sql_dialect=hive

# 로깅 (개발용 — 상대 경로 logs. 패키징 배포는 config.yml 기본값 /appuser/query-executor/logs 사용)
log.level=INFO
log.dir=logs
log.backup_count=30
log.filename.coordinator=query-coordinator-server.log
log.filename.executor=query-executor-server.log

# ───────── Coordinator ─────────
coordinator.host=0.0.0.0
coordinator.port=8088
# executor 실행 방식: remote(HTTP 디스패치) | local(in-process 직접 실행, 로컬 검증용)
# 환경변수 COORDINATOR_EXECUTOR_MODE=local 로도 즉시 토글 가능
coordinator.executor_mode=remote
# 멀티 coordinator 식별자(미지정 시 host:port). 환경변수 COORDINATOR_ID 로도 지정 가능
coordinator.id=

# Job 저장소: memory(휘발) | file(단일 노드 파일 영속/크래시 복구) | postgres(멀티 coordinator 공유, DSN 은 history.db_dsn 재사용)
store.backend=postgres
store.table=jobs
# backend=file 일 때 스냅샷 파일 경로(비우면 로그 디렉터리 옆 jobs-state.json)
store.path=

# / 모니터링 대시보드(읽기 전용, 비밀값 마스킹). 노출 우려 시 false
dashboard.enabled=true
# executor 서비스 URL 목록(쉼표 구분). systemd 인스턴스 포트와 일치시킬 것.
coordinator.executors=http://127.0.0.1:8087,http://127.0.0.1:8086
coordinator.max_concurrent_jobs=16
coordinator.max_dispatch_concurrency=32
coordinator.poll_interval_s=1.0
coordinator.task_timeout_s=3600
# executor 장애 대응: 연결 실패 시 재시도 후 다른 executor 로 failover
coordinator.task_connect_timeout_s=5.0
coordinator.task_max_retries=2
coordinator.task_retry_backoff_s=0.5
coordinator.task_failover=true
# executor 선택 정책(failover 순서): round_robin(기본) | least_loaded | p2c(HA 권장).
# least_loaded/p2c 는 HealthMonitor 스냅샷(헬스+부하)을 보고 살아있는·한가한 노드 먼저 시도.
coordinator.executor_select=round_robin

# Coordinator - executor 헬스 모니터링 & 메트릭 기록
monitor.enabled=true
monitor.health_interval_s=10
monitor.record_interval_s=60
# 기록 대상 PostgreSQL DSN. 비어 있으면 폴링만 하고 DB 기록은 하지 않는다.
monitor.db_dsn=
monitor.table=executor_health_metrics
monitor.disk_path=/

# 실행 이력(PostgreSQL). 비우면 monitor.db_dsn 재사용, 둘 다 없으면 비활성.
#  - history.table      : coordinator 가 기록하는 job 단위 이력
#  - history.task_table : executor 가 기록하는 task(=executor job) 단위 이력
# executor 도 이 DSN 으로 task_history 에 기록하므로 executor 호스트에 PG 자격증명 필요.
history.db_dsn=postgresql://coordinator:coordinator@localhost:5432/qq
history.table=job_history
history.task_table=task_history

# ───────── Executor ─────────
executor.host=0.0.0.0

# Executor - 멀티 coordinator: 자기 상태를 공유 DB에 self-report(coordinator는 읽기만)
executor.self_report=false
executor.status_table=executor_status
executor.status_interval_s=10
# executor 자체 동시 task 상한(admission control). 0=무제한
executor.max_concurrent_tasks=8
# 종료(SIGTERM) 시 진행 중 task 완료를 기다리는 최대 시간(초) — graceful drain
executor.shutdown_drain_timeout_s=25

# Executor - Impala (source). impala.host 가 비어 있으면 MockBackend 사용.
impala.host=
impala.port=21050
impala.database=default
# 인증: Impala 는 TLS + Kerberos 환경이므로 GSSAPI 사용
impala.auth_mechanism=GSSAPI
impala.kerberos_service_name=impala
# TLS (Impala 에만 적용)
impala.use_ssl=true
impala.ca_cert=/appuser/query-executor/config/impala-ca.pem
# user/password 는 GSSAPI 에서는 사용하지 않는다(LDAP/PLAIN 인증일 때만).
impala.user=
impala.password=
# Impala 쿼리 옵션 전역 기본값(SET). 예: MEM_LIMIT=2g,REQUEST_POOL=etl
# 비우면 configuration 없이 그대로 실행. 요청별 impala_query_options 가 덮어쓴다.
impala.query_options=
# Kerberos 티켓은 앱이 아니라 kinit-renew 런처가 keytab 으로 발급한다(deploy 참고).
# krb5 설정(realm/KDC)은 /appuser/query-executor/config/krb5.conf 를 KRB5_CONFIG 로 사용한다.
#   krb5.principal=svc-query@EXAMPLE.LOCAL
#   krb5.keytab=/appuser/query-executor/config/impala.keytab

# Executor - Greenplum (target). greenplum.dsn 이 비어 있으면 MockBackend 사용.
# Greenplum 은 TLS/Kerberos 미적용 — 일반 postgresql DSN.
#   예: postgresql://gpuser:gppassword@greenplum.example.local:5432/warehouse
greenplum.dsn=
copy.batch_size=10000
# copy 모드 COPY 전 컬럼 사전검증(SELECT 컬럼이 대상 테이블에 있는지). 불일치 시 조기 실패.
copy.preflight=true
