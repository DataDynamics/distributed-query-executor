[project]
name = "query-executor"
version = "0.1.0"
description = "Coordinator + N Executor API: split an Impala SELECT by partition IN-list and load into Greenplum"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlglot>=23",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Runtime DB drivers for the executor. Not needed for coordinator unit tests.
executor = [
    "impyla>=0.18",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coordinator", "executor"]
