[project]
name = "query-executor"
# 버전은 src/core/version.py 의 __version__ 을 유일 소스로 읽는다(아래 [tool.setuptools.dynamic]).
# 버전을 올릴 때는 그 파일 한 줄만 고치면 패키지 메타·기동 배너·--version 이 함께 따라온다.
dynamic = ["version"]
description = "Coordinator + N Executor API: Impala SELECT를 파티션 IN 목록으로 분할해 Greenplum에 적재"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<0.129",
    "uvicorn[standard]>=0.29,<0.40",
    "sqlglot>=30,<31",
    "httpx>=0.28,<1.0",
    "pydantic>=2.13,<3.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1,<4.0",
    "psutil>=5.9",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# executor 런타임 DB 드라이버. coordinator 단위 테스트에는 필요 없음.
executor = [
    "impyla>=0.19",
    "trino>=0.320",
    "thrift-sasl>=0.4.3",
    "pure-sasl>=0.6",
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# src 레이아웃: 소스는 src/ 아래에 있고 패키지명은 그대로 유지한다.
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "coordinator*", "executor*", "tools*"]
namespaces = false

# 동적 버전: src/core/version.py 의 __version__ 을 패키지 버전으로 읽는다(단일 소스).
[tool.setuptools.dynamic]
version = {attr = "core.version.__version__"}

# 에어갭 내장 웹 에셋(swagger-ui·redoc·폰트). wheel 로 빌드할 때도 포함되도록
# 명시한다(배포는 보통 rsync 로 소스 트리를 그대로 복사하지만 안전장치).
[tool.setuptools.package-data]
core = ["static/*", "static/fonts/*"]
