[project]
name = "query-executor"
version = "0.1.0"
description = "Coordinator + N Executor API: Impala SELECT를 파티션 IN 목록으로 분할해 Greenplum에 적재"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlglot>=23",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# executor 런타임 DB 드라이버. coordinator 단위 테스트에는 필요 없음.
executor = [
    "impyla>=0.18",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "coordinator", "executor"]

# 에어갭 내장 웹 에셋(swagger-ui·redoc·폰트). wheel 로 빌드할 때도 포함되도록
# 명시한다(배포는 보통 rsync 로 소스 트리를 그대로 복사하지만 안전장치).
[tool.setuptools.package-data]
core = ["static/*", "static/fonts/*"]
